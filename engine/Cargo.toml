[package]
name = "vrcinema"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

