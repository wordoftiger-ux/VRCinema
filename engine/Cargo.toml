[package]
name = "vrcinema"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
hmac = "0.13.0"
local-ip-address = "0.6.13"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
xz2 = "0.1.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

