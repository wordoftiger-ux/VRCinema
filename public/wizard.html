<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pierwsze uruchomienie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="wizard">
<main id="wizard">
  <ol class="steps" id="steps" aria-label="Postęp kreatora"><li></li><li></li><li></li><li></li></ol>
  <div id="step"></div>
</main>

<script type="module">
  import { api, apiRetry, el, notice, sleep, setupCopy, progressBar, setBar, encoderLabel, toolProgressList, TOOL_ORDER, watchToolsJob } from '/static/common.js';

  const stepRoot = document.getElementById('step');
  const dots = [...document.querySelectorAll('#steps li')];
  let info = null;

  function show(n, ...content) {
    dots.forEach((d, i) => {
      d.classList.toggle('done', i < n - 1);
      d.classList.toggle('current', i === n - 1);
    });
    stepRoot.replaceChildren(el('p', { class: 'step-no' }, `Krok ${n} z 4`), ...content);
    window.scrollTo(0, 0);
    stepRoot.querySelector('h1')?.focus();
  }

  const heading = (text) => el('h1', { tabindex: '-1' }, text);
  const actions = (...buttons) => el('div', { class: 'actions' }, ...buttons);

  // ---------- 1. Powitanie ----------
  function welcome() {
    show(1,
      heading('Witaj w VRCinema'),
      el('p', {}, 'Ten program prowadzi własny kanał wideo na żywo dla VRChat: Ty dodajesz filmy do kolejki, a odtwarzacz w świecie VRChat pokazuje je jeden po drugim.'),
      el('p', {}, 'Zanim zaczniemy, trzeba jednorazowo pobrać kilka programów pomocniczych i sprawdzić, czy komputer poradzi sobie z konwersją obrazu na karcie graficznej. Zajmie to kilka minut, a dalej poprowadzę Cię krok po kroku.'),
      actions(el('button', { type: 'button', onclick: tools }, 'Zaczynamy')));
  }

  // ---------- 2. Narzędzia ----------
  async function tools() {
    const list = toolProgressList(TOOL_ORDER);
    const status = el('p', { class: 'notice', role: 'status' });
    const next = el('button', { type: 'button', class: 'hidden', onclick: encoder }, 'Dalej');
    const retry = el('button', { type: 'button', class: 'hidden' }, 'Spróbuj ponownie');
    const later = el('button', { type: 'button', class: 'quiet hidden', onclick: () => finish() }, 'Pomiń i przejdź do panelu');
    show(2,
      heading('Pobieranie narzędzi'),
      el('p', {}, 'Pobieram programy, z których korzysta kanał. Nie zamykaj okna.'),
      list.root, status, actions(next, retry, later));

    let missing;
    async function start() {
      retry.classList.add('hidden');
      later.classList.add('hidden');
      notice(status, '');
      try {
        const t = await apiRetry('GET', '/api/desktop/tools');
        missing = t.missing;
        if (t.ok) return done(list, status, next, []);
        try {
          await apiRetry('POST', '/api/desktop/tools/install');
        } catch (err) {
          if (err.status !== 409) throw err; // zadanie już trwa: tylko je obserwujemy
        }
        await watch();
      } catch (err) {
        failed(err.message);
      }
    }

    async function watch() {
      const p = await watchToolsJob((progress) => list.update(missing, progress));
      if (p.error) return failed(p.error);
      const t = await apiRetry('GET', '/api/desktop/tools');
      if (t.ok) return done(list, status, next, missing);
      return failed('Nie wszystkie narzędzia zostały zainstalowane.');
    }

    function failed(message) {
      notice(status, `Nie udało się pobrać narzędzi: ${message}`, 'err');
      retry.classList.remove('hidden');
      later.classList.remove('hidden');
      retry.onclick = start;
    }

    start();
  }

  function done(list, status, next, missing) {
    list.update(missing, { done: true, running: false, error: null, tool: '' });
    notice(status, missing.length ? 'Wszystkie narzędzia są gotowe.' : 'Narzędzia są już zainstalowane.', 'ok');
    next.classList.remove('hidden');
    next.focus();
  }

  // ---------- 3. Karta graficzna ----------
  async function encoder() {
    const status = el('p', { class: 'notice', role: 'status' }, 'Sprawdzam kartę graficzną. To potrwa kilka sekund…');
    const result = el('div', { class: 'result hidden' });
    const next = el('button', { type: 'button', class: 'hidden', onclick: watching }, 'Dalej');
    const retry = el('button', { type: 'button', class: 'quiet hidden' }, 'Spróbuj ponownie');
    show(3,
      heading('Test karty graficznej'),
      el('p', {}, 'Konwersja obrazu na karcie graficznej jest dużo lżejsza dla komputera niż na procesorze. Sprawdzam, co da się wykorzystać.'),
      status, result, actions(next, retry));

    async function run() {
      retry.classList.add('hidden');
      result.classList.add('hidden');
      notice(status, 'Sprawdzam kartę graficzną. To potrwa kilka sekund…');
      try {
        const r = await apiRetry('POST', '/api/desktop/encoder/detect');
        const gpu = r.encoder !== 'libx264';
        result.replaceChildren(
          el('strong', {}, encoderLabel(r.encoder)),
          el('span', { class: 'muted' }, gpu ? 'Karta graficzna zajmie się konwersją obrazu.' : 'Nie znaleziono obsługiwanej karty, więc obraz konwertuje procesor. Kanał będzie działał, tylko mocniej obciąży komputer.'));
        result.classList.remove('hidden');
        notice(status, '');
        next.textContent = 'Dalej';
        next.classList.remove('hidden', 'quiet');
        next.focus();
      } catch (err) {
        notice(status, `Test się nie udał: ${err.message}`, 'err');
        retry.classList.remove('hidden');
        next.classList.remove('hidden');
        next.textContent = 'Pomiń ten krok';
        next.classList.add('quiet');
      }
    }
    retry.onclick = run;
    run();
  }

  // ---------- 4. Twój kanał w internecie ----------
  function watching() {
    const body = el('div', { class: 'stack', 'aria-live': 'polite' });
    const finishButton = el('button', { type: 'button', onclick: () => leave() }, 'Gotowe');
    const permanent = el('button', { type: 'button', class: 'quiet', onclick: () => leave('#internet') }, 'Chcę stały link');
    const retry = el('button', { type: 'button', onclick: tryAgain }, 'Spróbuj ponownie');
    const skip = el('button', { type: 'button', class: 'quiet', onclick: () => leave() }, 'Pomiń');
    const buttons = el('div', { class: 'actions' });
    show(4,
      heading('Twój kanał w internecie'),
      el('p', {}, 'Program sam łączy kanał z internetem, żeby odtwarzacz w VRChat mógł go otworzyć. Nie musisz niczego instalować ani wpisywać.'),
      body, buttons);

    let alive = true;
    let shown = '';
    async function leave(hash) {
      try {
        await finish(hash);
        alive = false;
      } catch (err) {
        body.append(el('p', { class: 'notice err', role: 'alert' }, err.message));
      }
    }
    const wait = progressBar('Łączenie z internetem');
    setBar(wait, null);

    function linkRow(label, value) {
      const input = el('input', { type: 'text', readonly: true, value, 'aria-label': label });
      const copy = el('button', { type: 'button', class: 'quiet' }, 'Kopiuj');
      setupCopy(input, copy);
      return el('div', {}, el('div', { class: 'muted small', style: 'margin-bottom:4px' }, label), el('div', { class: 'linkbox' }, input, copy));
    }

    function render(t) {
      const key = JSON.stringify([t.state, t.url, t.message]);
      if (key === shown) return;
      shown = key;
      if (t.state === 'online') {
        body.replaceChildren(
          el('p', { class: 'notice ok', role: 'status' }, 'Kanał jest w internecie.'),
          linkRow('Link kanału — wklej go w odtwarzaczu VRChat', `${t.url}/live/main.m3u8`),
          linkRow('Strona zgłoszeń dla widzów', `${t.url}/`),
          el('div', { class: 'qr-box' },
            el('img', { class: 'qr', src: `/api/desktop/tunnel/qr?address=${encodeURIComponent(t.url)}`, alt: 'Kod QR strony zgłoszeń', width: 220, height: 220 }),
            el('p', { class: 'muted small' }, 'Widzowie mogą zeskanować ten kod telefonem, żeby dodać film.')),
          el('p', { class: 'muted small' }, 'Ten adres zmienia się przy każdym uruchomieniu programu. Jeśli chcesz mieć stały link, możesz go ustawić teraz albo później w Ustawieniach.'));
        buttons.replaceChildren(finishButton, permanent);
        finishButton.focus({ preventScroll: true });
      } else if (t.state === 'error') {
        body.replaceChildren(
          el('p', { class: 'notice err', role: 'alert' }, t.message || 'Nie udało się połączyć z internetem.'),
          el('p', { class: 'muted small' }, 'Możesz spróbować jeszcze raz albo pominąć ten krok: kanał będzie wtedy działał tylko na tym komputerze, a połączenie ponowisz w Ustawieniach, w sekcji Internet.'));
        buttons.replaceChildren(retry, skip);
        retry.disabled = false;
      } else {
        body.replaceChildren(el('p', { class: 'notice', role: 'status' }, 'Łączenie z internetem…'), wait);
        buttons.replaceChildren();
      }
    }

    async function poll() {
      while (alive) {
        try {
          render(await api('GET', '/api/desktop/tunnel'));
        } catch {
          // serwer chwilowo nie odpowiada: następna próba
        }
        await sleep(1000);
      }
    }

    async function tryAgain() {
      retry.disabled = true;
      shown = '';
      render({ state: 'connecting' });
      try {
        await api('POST', '/api/desktop/tunnel/restart');
      } catch (err) {
        shown = '';
        render({ state: 'error', message: err.message });
      }
    }

    async function begin() {
      render({ state: 'connecting' });
      try {
        const c = await apiRetry('GET', '/api/desktop/config');
        if (!c.tunnelEnabled) await apiRetry('PUT', '/api/desktop/config', { tunnelEnabled: true });
      } catch (err) {
        shown = '';
        render({ state: 'error', message: err.message });
      }
      poll();
    }
    begin();
  }

  async function finish(hash = '') {
    await apiRetry('POST', '/api/desktop/wizard/complete');
    location.href = '/admin' + hash;
  }

  // ---------- Start ----------
  (async () => {
    try {
      info = await apiRetry('GET', '/api/desktop/info');
    } catch {
      location.replace('/admin'); // to nie okno aplikacji (albo sesja wygasła)
      return;
    }
    if (info.firstRunCompleted) {
      location.replace('/admin');
      return;
    }
    welcome();
  })();
</script>
</body>
</html>
