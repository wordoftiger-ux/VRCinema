[package]
name = "vrcinema-desktop"
version = "0.2.0"
edition = "2024"
description = "VRCinema"
publish = false

[[bin]]
name = "VRCinema"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vrcinema = { path = "../engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
rfd = "0.16"
anyhow = "1.0.104"
semver = "1.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["sync", "time", "net"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
# The mock runtime: the window commands' permissions are checked without a window.
tauri = { version = "2", features = ["tray-icon", "test"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

# Smaller debug builds: no debug info for the dependencies (the disk is tight).
[profile.dev.package."*"]
debug = false
